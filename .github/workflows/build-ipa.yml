name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        shell: bash
        run: |
          xcodebuild \
            -project WorldTrailsClub.xcodeproj \
            -scheme WorldTrailsClub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || status=$?
          # Surface compiler errors as annotations (readable without logging in).
          { grep -E "error:" xcodebuild.log || true; } | sort -u | head -40 | while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##; s#:([0-9]+):([0-9]+): error: .*##')
            l=$(echo "$line" | sed -nE 's#.*:([0-9]+):[0-9]+: error: .*#\1#p')
            m=$(echo "$line" | sed -E 's#.*error: ##')
            echo "::error file=${f},line=${l:-1}::${m}"
          done
          tail -20 xcodebuild.log
          exit ${status:-0}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorldTrailsClub.app Payload/
          zip -qry WorldTrailsClub.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorldTrailsClub-ipa
          path: WorldTrailsClub.ipa

      - name: Run core unit tests
        if: always()
        shell: bash
        continue-on-error: true
        working-directory: Packages/WorldTrailsCore
        run: |
          swift test > test.log 2>&1 || status=$?
          { grep -E "error:|failed" test.log || true; } | sort -u | head -30 | while IFS= read -r line; do echo "::warning::TEST ${line}"; done
          tail -5 test.log
          echo "::notice::$(tail -1 test.log)"
          exit ${status:-0}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
