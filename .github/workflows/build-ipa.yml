name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WorldTrailsClub.xcodeproj \
            -scheme WorldTrailsClub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorldTrailsClub.app Payload/
          zip -qry WorldTrailsClub.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorldTrailsClub-ipa
          path: WorldTrailsClub.ipa

      - name: Run core unit tests
        if: always()
        continue-on-error: true
        working-directory: Packages/WorldTrailsCore
        run: swift test

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
