# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: WorldTrailsClub
options:
  bundleIdPrefix: com.yourcompany          # TODO: change to your reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WorldTrailsCore:
    path: Packages/WorldTrailsCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                   # TODO: your Apple Developer Team ID
targets:
  WorldTrailsClub:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WorldTrailsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.worldtrailsclub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "World Trails"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"        # iPhone first; add ",2" for iPad later
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  WorldTrailsClubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WorldTrailsClub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.worldtrailsclub.uitests
        TEST_TARGET_NAME: WorldTrailsClub
schemes:
  WorldTrailsClub:
    build:
      targets:
        WorldTrailsClub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorldTrailsClubUITests
        - package: WorldTrailsCore/WorldTrailsCoreTests
